<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ComicCraft</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <h1>🎨 ComicCraft</h1>
  <p class="subtitle">AI Comic Story Creator</p>
  <form action="/generate" method="post">
    <label>Story Prompt</label>
    <textarea name="story_prompt" required placeholder="A brave fox exploring an enchanted forest"></textarea>
    <label>Main Character Name</label>
    <input name="character_name" required placeholder="Aria">
    <label>Setting</label>
    <select name="setting">
      <option>Forest</option><option>School</option><option>City</option><option>Space</option>
    </select>
    <label>Story Tone</label>
    <select name="tone">
      <option>Light-hearted</option><option>Dramatic</option><option>Funny</option><option>Poetic</option>
    </select>
    <label>Art Style</label>
    <select name="art_style">
      <option>Anime</option><option>Comic book</option><option>Pixel art</option><option>Realistic</option>
    </select>
    <button type="submit">✨ Generate Comic</button>
  </form>
  <p class="note">Demo mode: the interface and backend run without an API key. AI integration can be connected later.</p>
</div>
</body>
</html>
